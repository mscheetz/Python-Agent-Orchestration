services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-box
    ports:
      - "9092:9092"
    networks:
      - kafka-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-box:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-box:9093

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis/redis-stack:latest
    container_name: redis-box
    ports:
      - "6379:6379"
    networks:
      - kafka-net

  orchestrator:
    build: .
    command: python -m src.orchestrator
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-box:9092
      - REDIS_URL=redis://redis-box:6379/0
    networks:
      - kafka-net

  agent-1:
    build: .
    command: python -m src.agent agent-1
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-box:9092
      - REDIS_URL=redis://redis-box:6379/0
    networks:
      - kafka-net

  agent-2:
    build: .
    command: python -m src.agent agent-2
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-box:9092
      - REDIS_URL=redis://redis-box:6379/0
    networks:
      - kafka-net

  agent-3:
    build: .
    command: python -m src.agent agent-3
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-box:9092
      - REDIS_URL=redis://redis-box:6379/0
    networks:
      - kafka-net

  agent-4:
    build: .
    command: python -m src.agent agent-4
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-box:9092
      - REDIS_URL=redis://redis-box:6379/0
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.driver.mtu: "1400"